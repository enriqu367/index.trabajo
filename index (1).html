<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Captura de Datos</title>
</head>
<body>

  <h2>Captura de Datos</h2>

  <form id="formulario" action="https://script.google.com/macros/s/AKfycbzN9-0fOR0lX5xLwugw8taUwSqa_iBDnPeWzyfIX_LvenRgec0PbwjkXvPV1gpQH3wXBA/exec" method="POST" target="hidden_iframe" onsubmit="enviado()">
    <label for="nombre">Nombre:</label><br>
    <input type="text" id="nombre" name="nombre" required><br><br>

    <label for="edad">Edad:</label><br>
    <input type="number" id="edad" name="edad" required min="1" max="120"><br><br>

     <label for="colorfavorito">Color favorito:</label><br>
    <input type="text" id="colorfavorito" name="colorfavorito" required><br><br>

   <label for="direccion">Direccion:</label><br>
    <input type="text" id="direccion" name="direccion" required><br><br>

  <label for="peso">Peso:</label><br>
    <input type="number" id="peso" name="peso" required min="1" max="200"><br><br>

  <label for="talla">Talla:</label><br>
    <input type="number" id="talla" name="talla" required min="1" max="300"><br><br>

 <label for="ocupacion">Ocupacion:</label><br>
    <input type="text" id="ocupacion" name="ocupacion" required><br><br>

    <button type="submit" id="btnEnviar">Enviar</button>
    </form>

  <p id="estado"></p>

  <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

  <script>
    function enviado() {
      document.getElementById('btnEnviar').disabled = true;
      document.getElementById('estado').textContent = 'Guardando...';
      
      setTimeout(function() {
        document.getElementById('estado').textContent = '¡Registro guardado con éxito!';
        document.getElementById('formulario').reset();
        document.getElementById('btnEnviar').disabled = false;
      }, 1500);
    }
  </script>

</body>
</html>
.
